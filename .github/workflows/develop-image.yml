name: develop-image

# Develop-branch demo image: the plain Prohibitorum image built from `develop`,
# pushed under run-sortable tags to the same GHCR repo as releases. The k3s demo
# (TundraWork/prohibitorum-gitops) rolls it via Flux image automation.
# No separate "demo build" exists: same Dockerfile-less ko path as releases,
# just develop tags and no signing/attestation.
on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: develop-image-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  MISE_EXPERIMENTAL: true
  KO_DOCKER_REPO: ghcr.io/tundrawork/prohibitorum

jobs:
  build:
    # workflow_dispatch carries no branch restriction of its own, and the demo's
    # ImagePolicy selects the numerically highest run number — so a dispatch from
    # any other branch would publish a higher tag and roll that code onto the
    # public demo, with nothing in the tag to show where it came from.
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install toolchain (mise)
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          cache: false
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build SPA (go:embed bundle)
        # --force skips the sources/outputs gate: the image must ship a SPA
        # built from this checkout, never a stale/placeholder dist/ (PHB-37).
        run: mise run --force build:web
      - name: Build + push multi-arch image (ko)
        env:
          # run-number prefix keeps tags monotonically sortable — the demo's
          # ImagePolicy orders numerically on this prefix
          IMAGE_TAG: ${{ github.run_number }}-${{ github.sha }}
          # static binary for the distroless base (matches goreleaser's build env)
          CGO_ENABLED: "0"
        run: |
          tag="${IMAGE_TAG:0:13}"  # <run>-<12-char short sha>
          echo "building $KO_DOCKER_REPO:$tag and :develop"
          # -tags nodynamic: pure-Go imageutil (wazero), static binary for distroless
          GOFLAGS="-tags=nodynamic" mise exec -- ko build ./cmd/prohibitorum \
            --bare \
            --platform linux/amd64,linux/arm64 \
            --tags "$tag,develop" \
            --image-annotation org.opencontainers.image.source=https://github.com/TundraWork/Prohibitorum,org.opencontainers.image.revision=${{ github.sha }}
          echo "tag=$tag" >> "$GITHUB_ENV"
      - name: Show pushed tags
        run: echo "pushed $KO_DOCKER_REPO:$tag and :develop"
